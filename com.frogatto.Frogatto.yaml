app-id: com.frogatto.Frogatto
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: frogatto
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  # TODO: Replace all with dri + input whenever Flatpak 1.16 is prevalent enough
  - --device=all
  - --persist=.frogatto4

modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=filesystem,locale,regex,system
      - ./b2 install -j $FLATPAK_BUILDER_N_JOBS
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.bz2
        sha256: af57be25cb4c4f4b413ed692fe378affb4352ea50fbe294a11ef548f4d527d89

  - name: glew
    buildsystem: simple
    build-commands:
      - cmake -S build/cmake -B build/cmake/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${FLATPAK_DEST} -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_SHARED_LIBS=ON -DBUILD_UTILS=OFF
      - cmake --build build/cmake/build -j $FLATPAK_BUILDER_N_JOBS
      - cmake --install build/cmake/build
      # Drop the modern glew-config.cmake files: anura's CMakeLists uses
      # the legacy ${GLEW_LIBRARIES} variable, which only the FindGLEW
      # module sets. Without this, cmake's config-mode finds glew-config
      # first and leaves GLEW_LIBRARIES empty.
      - rm -rf ${FLATPAK_DEST}/lib/cmake/glew
    sources:
      - type: archive
        url: https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
        sha256: d4fc82893cfb00109578d0a1a2337fb8ca335b3ceccf97b97e5cc7f08e4353e1

  - name: sdl2_image
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL2IMAGE_VENDORED=OFF
      - -DSDL2IMAGE_SAMPLES=OFF
      - -DSDL2IMAGE_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.5/SDL2_image-2.8.5.tar.gz
        sha256: 8bc4c57f41e2c0db7f9b749b253ef6cecdc6f0b689ecbe36ee97b50115fff645

  - name: sdl2_ttf
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL2TTF_VENDORED=OFF
      - -DSDL2TTF_SAMPLES=OFF
      - -DSDL2TTF_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz
        sha256: 0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd

  - name: anura
    buildsystem: simple
    build-options:
      env:
        CXXFLAGS: '-DGLM_ENABLE_EXPERIMENTAL -DGLEW_NO_GLU -Wno-error=return-type -Wno-error=dangling-reference -Wno-error=deprecated-declarations -Wno-error=odr'
        CMAKE_PREFIX_PATH: /app
    build-commands:
      # Stage the FetchContent deps so:
      #   (1) the .cpp/.h files exist at the path anura's CMakeLists
      #       references for compilation (${CMAKE_SOURCE_DIR}/build/src/{imgui,glm}),
      #   (2) FetchContent skips its (network-blocked) populate step via
      #       FETCHCONTENT_SOURCE_DIR_* pointing at the populated sources.
      # The manifest git sources get co-located into the build dir at the
      # names given by their `dest:` fields (imgui-src, glm-src).
      - mkdir -p buildsystem/linux-dynamic/build/src
      - cp -r imgui-src buildsystem/linux-dynamic/build/src/imgui
      - cp -r glm-src buildsystem/linux-dynamic/build/src/glm
      - cmake buildsystem/linux-dynamic --preset=Release -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_IMGUI=$PWD/imgui-src -DFETCHCONTENT_SOURCE_DIR_GLM=$PWD/glm-src
      - cmake --build buildsystem/linux-dynamic/build/Release -j $FLATPAK_BUILDER_N_JOBS
    post-install:
      - install -Dm755 buildsystem/linux-dynamic/build/Release/anura ${FLATPAK_DEST}/lib/anura/anura
      - install -d ${FLATPAK_DEST}/share/anura
      - cp -r data images music modules ${FLATPAK_DEST}/share/anura/
    sources:
      - type: git
        url: https://github.com/anura-engine/anura.git
        commit: 66dfe723fedd76205acb35116a97fd1bad18f7fa
      - type: git
        url: https://github.com/ocornut/imgui.git
        tag: v1.89.7
        dest: imgui-src
      - type: git
        url: https://github.com/g-truc/glm.git
        commit: 33b0eb9fa336ffd8551024b1d2690e418014553b
        dest: glm-src

  - name: frogatto
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/share/anura/modules/frogatto
      - cp -pr module.cfg master-config.cfg data images locale music sounds ${FLATPAK_DEST}/share/anura/modules/frogatto/
      - install -Dm755 frogatto.sh ${FLATPAK_DEST}/bin/frogatto
      - install -Dm644 FreeDesktop/com.frogatto.Frogatto.desktop ${FLATPAK_DEST}/share/applications/com.frogatto.Frogatto.desktop
      - install -Dm644 FreeDesktop/com.frogatto.Frogatto.appdata.xml ${FLATPAK_DEST}/share/metainfo/com.frogatto.Frogatto.appdata.xml
      - install -Dm644 images/os/frogatto-icon.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/com.frogatto.Frogatto.png
    sources:
      - type: git
        url: https://github.com/frogatto/frogatto.git
        tag: '5.0'
        commit: 715e879078f7defcc1a5c65694543a4b69fdb5e4
      - type: script
        dest-filename: frogatto.sh
        commands:
          - cd /app/share/anura
          - exec /app/lib/anura/anura --module=frogatto "$@"

cleanup:
  - /share/anura/modules/frogatto/music_aac
  - /share/anura/modules/frogatto/sounds_wav
  - /include
  - '*.a'
